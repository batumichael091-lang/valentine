<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💕</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(120deg, #ff758c, #ff7eb3);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* NO button */
.no {
  background: #ddd;
}

/* ================= ENVELOPE ================= */
.envelope-screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

.envelope {
  width: 850px;
  height: 850px;  
  background: #fff;
  border-radius: 30px;
  position: relative;
  box-shadow: 0 30px 45px rgba(0,0,0,0.25);
  overflow: hidden;
}

.letter {
  position: absolute;
  inset: 10px;
  background: #ffe5ec;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end; /* OPEN button nasa bottom */
}

.letter img.slide {
  width: 100%;          
  height: 760px;
  object-fit: cover;
  border-radius: 12px;   
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease;
}

.letter button.open-btn {
  margin-top: 10px;
  padding: 16px 35px;
  border: none;
  border-radius: 25px;
  background: #e63946;
  color: white;
  font-size: 18px;
  cursor: pointer;
  position: relative;
  z-index: 5;
}

/* ================= MAIN CARD ================= */
.main { display: none; }

.container {
  width: 900px;
  height: 500px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  display: flex;
  overflow: hidden;
}

.image-side { width: 50%; }
.image-side img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.content-side {
  width: 50%;
  padding: 40px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

h1 { color: #e63946; font-size: 36px; }

.heart {
  font-size: 40px;
  margin: 20px 0;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

button {
  padding: 12px 30px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin: 10px;
  transition: transform 0.3s ease;
}

.yes { background: #e63946; color: white; }

/* ================= SURPRISE ================= */
.surprise {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.surprise-box {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

.surprise-box img {
  width: 300px;
  border-radius: 15px;
}

/* ================= FALLING HEART EFFECT ================= */
.falling-heart {
  position: fixed;
  top: -50px;
  font-size: 32px;
  pointer-events: none;
  animation:
    fall linear forwards,
    sway ease-in-out infinite,
    spin linear infinite;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity: 0; }
}
@keyframes sway {
  0% { margin-left: 0; }
  50% { margin-left: 30px; }
  100% { margin-left: 0; }
}
@keyframes spin {
  from { rotate: 0deg; }
  to { rotate: 360deg; }
}

/* ================= SPARKLE EFFECT ================= */
.sparkle {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: yellow;
  box-shadow: 0 0 8px yellow, 0 0 12px orange, 0 0 16px red;
  pointer-events: none;
  opacity: 0;
  animation: sparkleAnim 1s forwards;
}

@keyframes sparkleAnim {
  0% { transform: translate(0,0) scale(0.5); opacity: 1; }
  50% { transform: translate(0,-100px) scale(1); opacity: 1; }
  100% { transform: translate(0,-200px) scale(0); opacity: 0; }
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div class="envelope-screen" id="envelopeScreen">
  <div class="envelope">
    <div class="letter" id="letter">
      <img src="1.jpg" class="slide">
      <img src="2.jpg" class="slide">
      <img src="3.jpg" class="slide">
      <img src="4.jpg" class="slide">
      <img src="5.jpg" class="slide">
      <img src="6.jpg" class="slide">
      <button class="open-btn" onclick="openEnvelope()">OPEN 💌</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="container">
    <div class="image-side">
      <img src="junlemon.gif">
    </div>

    <div class="content-side">
      <h1>Hi, My Babu 💕</h1>
      <p>This Valentine’s Day, I have one question…</p>
      <div class="heart">❤️</div>
      <p>Will you be my Valentine?</p>

      <button class="yes" onclick="yesClicked()">Yes 💘</button>
      <button class="no" id="noBtn">No 😅</button>
    </div>
  </div>
</div>

<!-- SURPRISE -->
<div class="surprise" id="surprise">
  <div class="surprise-box">
    <img src="dudu.gif">
    <h2>I love you babuu!! 🌹</h2>
    <p>Date confirmed 💕</p>
  </div>
</div>

<script>
// ================= FADE SLIDESHOW =================
const slides = document.querySelectorAll(".slide");
let current = 0;
slides.forEach((img, i) => img.style.opacity = (i === 0 ? 1 : 0));
setInterval(() => {
  slides[current].style.opacity = 0;
  current = (current + 1) % slides.length;
  slides[current].style.opacity = 1;
}, 2000);

// ========== OPEN ENVELOPE ==========
function openEnvelope() {
  document.getElementById("envelopeScreen").style.display = "none";
  document.getElementById("main").style.display = "block";

  // Falling hearts effect
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.className = "falling-heart";
    heart.innerHTML = ["❤️","💖","💘"][Math.floor(Math.random()*3)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    heart.style.animationDuration = 
      (4 + Math.random() * 3) + "s, " +  // fall
      (2 + Math.random() * 2) + "s, " +  // sway
      (3 + Math.random() * 3) + "s";     // spin
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }
}

// ========== YES BUTTON ==========
function yesClicked() {
  const surprise = document.getElementById("surprise");
  surprise.style.display = "flex";

  // Sparkling effect
  for (let i = 0; i < 50; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.left = Math.random() * window.innerWidth + "px";
    sparkle.style.top = Math.random() * window.innerHeight + "px";
    sparkle.style.animationDuration = (0.8 + Math.random() * 0.5) + "s";
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 1500);
  }
}

// ========== NO BUTTON ESCAPE ==========
const noBtn = document.getElementById("noBtn");
const container = document.querySelector(".content-side");
noBtn.addEventListener("mouseenter", () => {
  noBtn.style.position = "absolute";
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
});
</script>

</body>
</html>
