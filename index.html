<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You 💕</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(120deg, #ff758c, #ff7eb3);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

/* NO button */
.no { background: #ddd; }

/* ================= ENVELOPE ================= */
.envelope-screen {
  position: fixed;
  inset: 0;
  background: linear-gradient(120deg, #ff9a9e, #fad0c4);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  overflow: hidden;
}

/* Floating hearts upwards behind envelope */
.envelope-screen .bg-heart {
  position: absolute;
  font-size: 20px;
  opacity: 0.7;
  z-index: 0;
  animation: float-up linear infinite, sway 4s ease-in-out infinite;
}

/* ================= SIDE IMAGES ================= */
.side-images .bg-side-img {
  position: absolute;
  bottom: -50px;
  width: 50px;
  height: 50px;
  object-fit: cover;
  opacity: 0.8;
  pointer-events: none;
  z-index: 0;
  animation: float-up-side linear infinite, sway-side 4s ease-in-out infinite;
}

@keyframes float-up-side {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-300px) rotate(360deg); opacity: 0; }
}

@keyframes sway-side {
  0% { transform: translateX(0); }
  25% { transform: translateX(15px); }
  50% { transform: translateX(0); }
  75% { transform: translateX(-15px); }
  100% { transform: translateX(0); }
}

/* ================= FLOATING HEART ANIMATION ================= */
@keyframes float-up {
  0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-350px) rotate(360deg); opacity: 0; } /* higher float */
}

@keyframes sway {
  0% { transform: translateX(0); }
  25% { transform: translateX(20px); }
  50% { transform: translateX(0); }
  75% { transform: translateX(-20px); }
  100% { transform: translateX(0); }
}

/* ================= ENVELOPE CONTENT ================= */
.envelope {
  width: 850px;
  height: 850px;  
  background: #fff;
  border-radius: 30px;
  position: relative;
  box-shadow: 0 30px 45px rgba(0,0,0,0.25);
  overflow: hidden;
  z-index: 1;
}

.letter {
  position: absolute;
  inset: 10px;
  background: #ffe5ec;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
}

.letter img.slide {
  width: 100%;          
  height: 760px;
  object-fit: cover;
  border-radius: 12px;   
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease;
}

.letter button.open-btn {
  margin-top: 10px;
  padding: 16px 35px;
  border: none;
  border-radius: 25px;
  background: #e63946;
  color: white;
  font-size: 18px;
  cursor: pointer;
  position: relative;
  z-index: 5;
}

/* ================= MAIN CARD ================= */
.main { display: none; }

.container {
  width: 900px;
  height: 500px;
  background: white;
  border-radius: 25px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  display: flex;
  overflow: hidden;
  position: relative;
}

.image-side { width: 50%; position: relative; }
.image-side .gif-hearts { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.image-side img { width: 100%; height: 100%; object-fit: cover; position: relative; z-index: 1; }

.content-side {
  width: 50%;
  padding: 40px;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}

h1 { color: #e63946; font-size: 36px; }

.heart {
  font-size: 40px;
  margin: 20px 0;
  animation: beat 1s infinite;
}

@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.3); }
}

button {
  padding: 12px 30px;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  cursor: pointer;
  margin: 10px;
  transition: transform 0.3s ease;
}

.yes { background: #e63946; color: white; }

/* ================= SURPRISE ================= */
.surprise {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 20;
}

.surprise-box {
  background: white;
  padding: 25px;
  border-radius: 20px;
  text-align: center;
}

.surprise-box img {
  width: 300px;
  border-radius: 15px;
}

/* ================= FALLING HEART EFFECT ================= */
.falling-heart {
  position: fixed;
  top: -50px;
  font-size: 32px;
  pointer-events: none;
  animation:
    fall linear forwards,
    sway ease-in-out infinite,
    spin linear infinite;
}

@keyframes fall {
  to { transform: translateY(110vh); opacity: 0; }
}
@keyframes sway {
  0% { margin-left: 0; }
  50% { margin-left: 30px; }
  100% { margin-left: 0; }
}
@keyframes spin {
  from { rotate: 0deg; }
  to { rotate: 360deg; }
}

/* ================= HEARTS BEHIND GIF ON MAIN PAGE ================= */
.bg-heart-main {
  position: absolute;
  top: 100%;
  font-size: 20px;
  opacity: 0.7;
  pointer-events: none;
  animation: float-up-main linear infinite, sway-main 4s ease-in-out infinite;
  z-index: 0;
}

@keyframes float-up-main {
  0% { transform: translateY(100%); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-200px); opacity: 0; }
}

@keyframes sway-main {
  0% { transform: translateX(0); }
  25% { transform: translateX(15px); }
  50% { transform: translateX(0); }
  75% { transform: translateX(-15px); }
  100% { transform: translateX(0); }
}

/* ================= SPARKLE EFFECT ================= */
.sparkle {
  position: fixed;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: yellow;
  box-shadow: 0 0 8px yellow, 0 0 12px orange, 0 0 16px red;
  pointer-events: none;
  opacity: 0;
  animation: sparkleAnim 1s forwards;
}

@keyframes sparkleAnim {
  0% { transform: translate(0,0) scale(0.5); opacity: 1; }
  50% { transform: translate(0,-100px) scale(1); opacity: 1; }
  100% { transform: translate(0,-200px) scale(0); opacity: 0; }
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div class="envelope-screen" id="envelopeScreen">
  <!-- Container for side images -->
  <div class="side-images"></div>

  <div class="envelope">
    <div class="letter" id="letter">
      <img src="1.jpg" class="slide">
      <img src="2.jpg" class="slide">
      <img src="3.jpg" class="slide">
      <img src="4.jpg" class="slide">
      <img src="5.jpg" class="slide">
      <img src="6.jpg" class="slide">
      <button class="open-btn" onclick="openEnvelope()">OPEN 💌</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="container">
    <div class="image-side">
      <div class="gif-hearts"></div> <!-- hearts behind GIF -->
      <img src="junlemon.gif">
    </div>

    <div class="content-side">
      <h1>Hi, My Babu 💕</h1>
      <p>This Valentine’s Day, I have one question…</p>
      <div class="heart">❤️</div>
      <p>Will you be my Valentine?</p>

      <button class="yes" onclick="yesClicked()">Yes 💘</button>
      <button class="no" id="noBtn">No 😅</button>
    </div>
  </div>
</div>

<!-- SURPRISE -->
<div class="surprise" id="surprise">
  <div class="surprise-box">
    <img src="dudu.gif">
    <h2>I love you babuu!! 🌹</h2>
    <p>Date confirmed 💕</p>
  </div>
</div>

<script>
// ================= FADE SLIDESHOW =================
const slides = document.querySelectorAll(".slide");
let current = 0;
slides.forEach((img, i) => img.style.opacity = (i === 0 ? 1 : 0));
setInterval(() => {
  slides[current].style.opacity = 0;
  current = (current + 1) % slides.length;
  slides[current].style.opacity = 1;
}, 2000);

// ================= HEART BACKGROUND FOR ENVELOPE =================
const envelopeScreen = document.getElementById("envelopeScreen");

// Create 120 hearts floating upwards (more hearts!)
for (let i = 0; i < 120; i++) {
  const bgHeart = document.createElement("div");
  bgHeart.className = "bg-heart";
  bgHeart.innerHTML = ["❤️","💖","💘","💕","💗"][Math.floor(Math.random()*5)];
  bgHeart.style.left = Math.random() * 100 + "vw";
  bgHeart.style.fontSize = (15 + Math.random() * 25) + "px";
  bgHeart.style.animationDuration = (10 + Math.random() * 5) + "s";
  bgHeart.style.animationDelay = Math.random() * 5 + "s";
  envelopeScreen.appendChild(bgHeart);
}

// ================= SIDE IMAGES ON LEFT/RIGHT =================
const sideImagesContainer = document.querySelector(".side-images");
for (let i = 0; i < 20; i++) {
  const img = document.createElement("img");
  img.className = "bg-side-img";
  img.src = ["pic1.png","pic2.png","pic3.png"][Math.floor(Math.random()*3)]; // your side pics
  img.style.left = (Math.random() < 0.5 ? "0%" : "85%"); // left or right
  img.style.width = (30 + Math.random() * 40) + "px";
  img.style.height = img.style.width;
  img.style.animationDuration = (8 + Math.random() * 5) + "s";
  img.style.animationDelay = Math.random() * 5 + "s";
  sideImagesContainer.appendChild(img);
  setTimeout(() => img.remove(), 10000);
}

// ========== OPEN ENVELOPE ==========
function openEnvelope() {
  document.getElementById("envelopeScreen").style.display = "none";
  document.getElementById("main").style.display = "block";

  // Falling hearts effect
  for (let i = 0; i < 30; i++) {
    const heart = document.createElement("div");
    heart.className = "falling-heart";
    heart.innerHTML = ["❤️","💖","💘","💕","💗"][Math.floor(Math.random()*5)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 20) + "px";
    heart.style.animationDuration = 
      (4 + Math.random() * 3) + "s, " +
      (2 + Math.random() * 2) + "s, " +
      (3 + Math.random() * 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 7000);
  }

  // Hearts floating left and right of GIF
  const gifHeartsContainer = document.querySelector(".gif-hearts");
  for (let i = 0; i < 20; i++) {
    const heart = document.createElement("div");
    heart.className = "bg-heart-main";
    heart.innerHTML = ["❤️","💖","💘","💕","💗"][Math.floor(Math.random()*5)];
    heart.style.left = (Math.random() < 0.5 ? "0%" : "85%");
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    heart.style.animationDuration = (5 + Math.random() * 4) + "s";
    heart.style.animationDelay = Math.random() * 2 + "s";
    gifHeartsContainer.appendChild(heart);
    setTimeout(() => heart.remove(), 9000);
  }
}

// ========== YES BUTTON ==========
function yesClicked() {
  const surprise = document.getElementById("surprise");
  surprise.style.display = "flex";

  for (let i = 0; i < 50; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.left = Math.random() * window.innerWidth + "px";
    sparkle.style.top = Math.random() * window.innerHeight + "px";
    sparkle.style.animationDuration = (0.8 + Math.random() * 0.5) + "s";
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 1500);
  }
}

// ========== NO BUTTON ESCAPE ==========
const noBtn = document.getElementById("noBtn");
const container = document.querySelector(".content-side");
noBtn.addEventListener("mouseenter", () => {
  noBtn.style.position = "absolute";
  const maxX = container.clientWidth - noBtn.offsetWidth;
  const maxY = container.clientHeight - noBtn.offsetHeight;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
});
</script>

</body>
</html>
